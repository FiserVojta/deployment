name: Build PostGIS operand image

on:
  push:
    branches: [main]
    paths:
      - images/postgis/**
      - .github/workflows/postgis-image.yml
  # Rebuild for Debian/PGDG security updates without waiting for a code change.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fiservojta/coolcorners-postgis
  # Postgres minor and PostGIS major.minor baked into the image.
  VERSION: 17.9-3.6

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/postgis
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ github.sha }}

      # Deliberately does NOT bump postgres/cluster.yaml. Changing a database's
      # image restarts the database, so that stays a manual, chosen action —
      # unlike the app deployments, which auto-bump.
      - name: Summary
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "Update postgres/cluster.yaml manually to roll the database onto it." >> $GITHUB_STEP_SUMMARY
