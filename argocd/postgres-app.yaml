apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coolcorners-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FiserVojta/coolcornersdeployment.git
    targetRevision: HEAD
    path: postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      # prune is deliberately OFF for the database. With it on, removing a file
      # here would delete the Cluster and take the running database with it.
      prune: false
      selfHeal: true
