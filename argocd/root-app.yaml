apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coolcorners-root
  namespace: argocd
spec:
  project: default
  # App-of-apps: this single Application manages every other Application CR
  # found in the argocd/ folder of the deployment repo (including itself).
  source:
    repoURL: https://github.com/FiserVojta/coolcornersdeployment.git
    targetRevision: HEAD
    path: argocd
    # All *-app.yaml manifests live flat in argocd/, so the default
    # (non-recursive) directory behaviour is what we want. Do not set
    # `directory.recurse: false` explicitly: the API server drops the zero
    # value, so the desired manifest can never match live and the app sits
    # permanently OutOfSync.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
